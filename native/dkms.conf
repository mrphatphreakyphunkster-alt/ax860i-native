PACKAGE_NAME="ax860i-native"
PACKAGE_VERSION="0.1.0"
BUILT_MODULE_NAME[0]="ax860i_native"
BUILT_MODULE_LOCATION[0]="."
DEST_MODULE_LOCATION[0]="/kernel/drivers/hwmon"
AUTOINSTALL="yes"
# Explicit target, no uname or wrapper Makefile default, no eval in our helper.
MAKE[0]="/usr/bin/python3 -I ${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build/build_module.py --kernelver ${kernelver} --module-dir ${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build"
CLEAN="make -C /lib/modules/${kernelver}/build M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build clean"
